- name: tupleset relation without metadata
  json: |
    {
      "schema_version": "1.1",
      "type_definitions": [
        {
          "type": "user"
        },
        {
          "type": "document",
          "relations": {
            "owner": {
              "this": {}
            },
            "parent": {
              "computedUserset": {
                "relation": "owner"
              }
            },
            "viewer": {
              "tupleToUserset": {
                "tupleset": {
                  "relation": "parent"
                },
                "computedUserset": {
                  "relation": "viewer"
                }
              }
            }
          },
          "metadata": {
            "relations": {
              "owner": {
                "directly_related_user_types": [
                  {
                    "type": "user"
                  }
                ]
              }
            }
          }
        }
      ]
    }
  expected_errors:
    - msg: "`parent` relation used inside from allows only direct relation."
      metadata:
        symbol: "parent"
        errorType: tupleuserset-not-direct

- name: type restriction on a relation of a type without relations
  json: |
    {
      "schema_version": "1.1",
      "type_definitions": [
        {
          "type": "user"
        },
        {
          "type": "document",
          "relations": {
            "viewer": {
              "this": {}
            }
          },
          "metadata": {
            "relations": {
              "viewer": {
                "directly_related_user_types": [
                  {
                    "type": "user",
                    "relation": "member"
                  }
                ]
              }
            }
          }
        }
      ]
    }
  expected_errors:
    - msg: "`member` is not a valid relation for `user`."
      metadata:
        symbol: "user#member"
        errorType: invalid-relation-type

- name: tuple to userset through a type without relations
  json: |
    {
      "schema_version": "1.1",
      "type_definitions": [
        {
          "type": "user"
        },
        {
          "type": "document",
          "relations": {
            "parent": {
              "this": {}
            },
            "viewer": {
              "tupleToUserset": {
                "tupleset": {
                  "relation": "parent"
                },
                "computedUserset": {
                  "relation": "viewer"
                }
              }
            }
          },
          "metadata": {
            "relations": {
              "parent": {
                "directly_related_user_types": [
                  {
                    "type": "user"
                  }
                ]
              }
            }
          }
        }
      ]
    }
  expected_errors:
    - msg: "the `viewer` relation definition on type `document` is not valid: `viewer` does not exist on `parent`, which is of type `user`."
      metadata:
        symbol: "viewer from parent"
        errorType: invalid-relation-on-tupleset

